services:
  postgres:
    image: postgres:16-alpine
    container_name: requirements-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: requirements_db
      POSTGRES_USER: requirements
      POSTGRES_PASSWORD: requirements
    ports:
      # Host port 5432 is already occupied by the Windows PostgreSQL service.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requirements -d requirements_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
